name: flutter_github_updater
description: >-
  One-command auto-setup for in-app updates via GitHub Releases. Run
  `dart run flutter_github_updater:setup` and it generates all Android native
  code, manifest entries, signing config, and CI/CD workflows automatically.
version: 1.1.0
homepage: https://github.com/AAShayon/flutter_github_updater
repository: https://github.com/AAShayon/flutter_github_updater
issue_tracker: https://github.com/AAShayon/flutter_github_updater/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^10.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  args: ^2.5.0
  path: ^1.9.0
  yaml: ^3.1.0

executables:
  setup: setup

flutter:
  plugin:
    platforms:
      android:
        package: com.fluttergithubupdater
        pluginClass: FlutterGithubUpdaterPlugin
